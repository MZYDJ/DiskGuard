name: linux-script

on:
  push:
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gdisk lvm2

      - name: Bash syntax check
        run: bash -n Tests/fixtures/Linux_Setup.sh

      - name: Loop device end-to-end test
        run: sudo bash Tests/LinuxIntegration.sh Tests/fixtures/Linux_Setup.sh